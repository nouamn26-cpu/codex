# Five independent MERN portfolio demos. No paid compute is declared.
services:
- type: web
  name: shopflow-nouamn-portfolio
  runtime: node
  plan: free
  rootDir: mern-portfolio/01-shopflow
  buildCommand: npm ci --include=dev && npm run build
  startCommand: npm start
  healthCheckPath: /api/health
  envVars:
  - key: NODE_VERSION
    value: '24'
  - key: NODE_ENV
    value: production
  - key: JWT_SECRET
    generateValue: true
  - key: MONGODB_URI
    sync: false
  - key: SEED_DEMO
    value: 'true'
  branch: portfolio-live
  region: singapore
  autoDeployTrigger: 'off'

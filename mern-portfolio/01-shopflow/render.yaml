# For a standalone repository containing this project's package.json at its root.
# If the entire portfolio pack is one repo, change rootDir to 01-shopflow.
services:
  - type: web
    name: shopflow-demo
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SEED_DEMO
        value: "true"
